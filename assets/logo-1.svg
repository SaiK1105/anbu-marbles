<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80" role="img" aria-labelledby="anbuTitle">
  <title id="anbuTitle">ANBU Group — Marble World Exports</title>
  <defs>
    <linearGradient id="anbuRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2583F"/>
      <stop offset="1" stop-color="#C62F24"/>
    </linearGradient>
    <linearGradient id="anbuGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3DFA6"/>
      <stop offset=".55" stop-color="#CFA245"/>
      <stop offset="1" stop-color="#A67C24"/>
    </linearGradient>
  </defs>

  <!-- crescent: outer circle (39,41) r27 against offset inner circle (40.2,41) r25.6 -> 2.6 belly, needle tips -->
  <path d="M51.7 17.2A27 27 0 1 0 51.7 64.8L51.3 64.1A25.6 25.6 0 1 1 51.3 17.9Z" fill="url(#anbuGold)"/>

  <!-- accent tick above the A -->
  <path d="M80 18.6 86.6 12.4" stroke="url(#anbuGold)" stroke-width="2.1" stroke-linecap="round" fill="none"/>

  <!-- wordmark -->
  <text x="69" y="50" textLength="158" lengthAdjust="spacing"
        font-family="Georgia,'Times New Roman',serif" font-size="42"
        fill="url(#anbuRed)">ANBU</text>

  <!-- hairline + tagline -->
  <path d="M70 58.5H227" stroke="#C9A24A" stroke-width=".75" opacity=".7" fill="none"/>
  <text x="70" y="69" textLength="157" lengthAdjust="spacing"
        font-family="'Helvetica Neue',Arial,sans-serif" font-size="7.2"
        fill="#D6CCB8">MARBLE WORLD EXPORTS</text>
</svg>